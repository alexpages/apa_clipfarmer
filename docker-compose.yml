version: '3.8'

services:
  mysql:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: clipfarmer
      MYSQL_USER: clipfarmer
      MYSQL_PASSWORD: clipfarmer
    ports:
      - "3306:3306"
    volumes:
      - ./src/main/resources/tables.sql:/docker-entrypoint-initdb.d/01_tables.sql
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  mysql_data:
