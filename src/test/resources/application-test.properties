# Datasource — overridden at runtime by @DynamicPropertySource via Testcontainers
spring.datasource.url=jdbc:mysql://localhost:3306/clipfarmer
spring.datasource.username=clipfarmer
spring.datasource.password=clipfarmer
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# MyBatis
mybatis.config-location=classpath:mybatis/mybatis-config.xml

# JPA — no DDL management, schema is handled by Testcontainers init script
spring.jpa.hibernate.ddl-auto=none
